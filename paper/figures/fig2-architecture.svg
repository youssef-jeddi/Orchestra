<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- User -->
  <rect x="18" y="195" width="128" height="78" rx="10" fill="#f2f2f0" stroke="#c9c8c4" stroke-width="1.2"/>
  <text x="82" y="222" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">User intent</text>
  <text x="82" y="240" font-size="10" font-style="italic" fill="#52514e" text-anchor="middle">"swap 10 USDC</text>
  <text x="82" y="253" font-size="10" font-style="italic" fill="#52514e" text-anchor="middle">for ETH"</text>
  <line x1="146" y1="234" x2="166" y2="234" stroke="#52514e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Ring 0: Interpretation -->
  <rect x="170" y="140" width="185" height="190" rx="12" fill="#e9f1fb" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="182" y="162" font-size="11" font-weight="700" fill="#1c5cab">RING 0 · INTERPRETATION</text>
  <text x="182" y="177" font-size="10" font-style="italic" fill="#52514e">probabilistic — zero authority</text>
  <rect x="190" y="195" width="145" height="54" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="262" y="217" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Planner LLM</text>
  <text x="262" y="234" font-size="10.5" fill="#52514e" text-anchor="middle">NL → typed plan</text>
  <text x="262" y="272" font-size="10" fill="#52514e" text-anchor="middle">action · token addresses</text>
  <text x="262" y="286" font-size="10" fill="#52514e" text-anchor="middle">· amounts</text>
  <text x="262" y="312" font-size="10" font-style="italic" fill="#52514e" text-anchor="middle">nothing it emits is trusted</text>

  <line x1="355" y1="234" x2="388" y2="234" stroke="#52514e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Ring 1: Deterministic policy -->
  <rect x="392" y="90" width="240" height="290" rx="12" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
  <text x="404" y="112" font-size="11" font-weight="700" fill="#b34a1d">RING 1 · DETERMINISTIC POLICY</text>
  <text x="404" y="127" font-size="10" font-style="italic" fill="#52514e">pure code — fail-closed</text>
  <rect x="410" y="140" width="204" height="46" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.2"/>
  <text x="512" y="158" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">Server-side revaluation</text>
  <text x="512" y="175" font-size="10" fill="#52514e" text-anchor="middle">re-price from params · live feed</text>
  <line x1="512" y1="186" x2="512" y2="197" stroke="#52514e" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="410" y="200" width="204" height="96" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.2"/>
  <text x="512" y="220" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">decide()</text>
  <text x="512" y="238" font-size="10" fill="#52514e" text-anchor="middle">daily limit · token allow-list</text>
  <text x="512" y="252" font-size="10" fill="#52514e" text-anchor="middle">recipient allow-list · velocity</text>
  <text x="512" y="266" font-size="10" fill="#52514e" text-anchor="middle">habit anomaly · deny-list</text>
  <text x="512" y="284" font-size="10" font-style="italic" fill="#52514e" text-anchor="middle">unknown ⇒ approval (fail-closed)</text>
  <line x1="512" y1="296" x2="512" y2="313" stroke="#52514e" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="436" y="316" width="152" height="30" rx="15" fill="#fbe7e7" stroke="#d03b3b" stroke-width="1.2"/>
  <text x="512" y="335" font-size="11" font-weight="700" fill="#8f2626" text-anchor="middle">✕ BLOCKED — dropped</text>

  <!-- NEEDS_APPROVAL path -->
  <path d="M 614 224 L 644 224 L 644 150 L 660 150" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="652" y="212" font-size="10" font-weight="700" fill="#7a5600" text-anchor="middle" transform="rotate(-90 652 212)">NEEDS_APPROVAL</text>

  <!-- AUTO path -->
  <path d="M 614 266 L 644 266 L 644 315 L 660 315" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="652" y="300" font-size="10" font-weight="700" fill="#0a6b0a" text-anchor="middle" transform="rotate(-90 652 300)">AUTO</text>

  <!-- Ring 3: Human anchor -->
  <rect x="664" y="95" width="218" height="122" rx="12" fill="#fdf3dd" stroke="#eda100" stroke-width="1.6"/>
  <text x="676" y="117" font-size="11" font-weight="700" fill="#8a5f00">RING 3 · HUMAN ANCHOR</text>
  <text x="676" y="132" font-size="10" font-style="italic" fill="#52514e">value-tiered second factor</text>
  <text x="676" y="156" font-size="11" fill="#0b0b0b">passkey ≤ $1,000</text>
  <text x="676" y="173" font-size="11" fill="#0b0b0b">Ledger secure screen &gt; $1,000</text>
  <text x="676" y="196" font-size="10" font-style="italic" fill="#52514e">clear-signed: human approves</text>
  <text x="676" y="209" font-size="10" font-style="italic" fill="#52514e">the actual transaction</text>

  <line x1="773" y1="217" x2="773" y2="256" stroke="#52514e" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="782" y="241" font-size="10" fill="#52514e">approved</text>

  <!-- Ring 2: On-chain bounds -->
  <rect x="664" y="260" width="218" height="140" rx="12" fill="#e4f6ef" stroke="#1baf7a" stroke-width="1.6"/>
  <text x="676" y="282" font-size="11" font-weight="700" fill="#0e7a54">RING 2 · ON-CHAIN BOUNDS</text>
  <text x="676" y="297" font-size="10" font-style="italic" fill="#52514e">contract-enforced delegation</text>
  <text x="676" y="320" font-size="11" font-weight="700" fill="#0b0b0b">Safe account + AllowanceModule</text>
  <text x="676" y="337" font-size="10" fill="#52514e">the agent key is a delegate with a</text>
  <text x="676" y="351" font-size="10" fill="#52514e">capped allowance — even a fully</text>
  <text x="676" y="365" font-size="10" fill="#52514e">compromised server can't exceed it</text>
  <text x="676" y="388" font-size="10" font-style="italic" fill="#0e7a54">→ execution on chain</text>
</svg>
